[project]
name = "cv-agent"
version = "0.0.1b0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ziqin Gong", email = "gongzq0301@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.10",
    "minio>=7.2.18",
    "omegaconf>=2.3.0",
    "pillow>=12.0.0",
    "ray[default]>=2.51.1",
    "requests>=2.32.3",
    "backoff>=2.2.1",
    "datasets<4.0.0",
    "langfuse==3.14.5",
    "sentence-transformers>=5.4.0",
    "scikit-learn>=1.8.0",
    "joblib>=1.5.3",
    "qwen-vl-utils>=0.0.14",
    "torchvision>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
ollama = [
    "langchain-ollama>=0.3.10",
]
langfuse = [
    "langfuse>=3.8.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.6.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",
    # logging format
    "G",
]
ignore = [
    # allow f-string for logging
    "G004",
]
